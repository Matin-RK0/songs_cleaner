name: songs_cleaner
description: "A local music player with on-the-fly library cleanup."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  on_audio_query: ^2.9.0
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  handy_tdlib_next: 2.3.16
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  on_audio_query_android:
    path: third_party/on_audio_query_android

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/roboto/OFL.txt
  # SDK 3.50 gen-l10n still emits legacy delegates. Use the checked-in,
  # migrated output from: dart run tool/generate_localizations.dart
  generate: false
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-ExtraBold.ttf
          weight: 800
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
